<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>weather_glass</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="flowCanvas"></canvas>
    <nav>
      <span class="logo">weather_glass</span>
    </nav>
    <main>
      <section class="hero">
        <span id="cityLabel" class="city-label">Seoul 기준</span>
        <h1>오늘의 공기를 흐름으로 그리다</h1>
        <p>시간에 따라 달라지는 공기의 흐름을 파티클로 그려냅니다.</p>
        <div class="slider-row">
          <input
            id="timeSlider"
            type="range"
            min="0"
            max="24"
            step="0.1"
            value="12"
            aria-label="시간 (0시부터 24시까지)"
          />
          <button type="button" id="playButton" class="play-button" aria-pressed="false">▶ 하루 흐름 보기</button>
        </div>
        <div class="time-info">
          <span id="currentTime">12:00</span>
          <span id="weatherLabel">정오</span>
        </div>
      </section>

      <section class="right-now fade-up">
        <h2>Right now</h2>
        <ul id="cityList">
          <li>
            <button type="button" class="city-button" data-name="Seoul" data-lat="37.5665" data-lon="126.978" aria-pressed="false">
              <span class="weather-icon" aria-hidden="true"></span>
              <span class="city">Seoul</span><span class="temp">--</span><span class="weather">Loading…</span>
              <span class="wind">
                <svg class="wind-arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2 L11.5 9 L8 7 L4.5 9 Z" fill="currentColor" /></svg>
                <span class="wind-value"></span>
              </span>
              <span class="precip" hidden>
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2C8 2 3.5 8 3.5 11a4.5 4.5 0 0 0 9 0C12.5 8 8 2 8 2Z" fill="currentColor" /></svg>
                <span class="precip-value"></span>
              </span>
            </button>
          </li>
          <li>
            <button type="button" class="city-button" data-name="London" data-lat="51.5074" data-lon="-0.1278" aria-pressed="false">
              <span class="weather-icon" aria-hidden="true"></span>
              <span class="city">London</span><span class="temp">--</span><span class="weather">Loading…</span>
              <span class="wind">
                <svg class="wind-arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2 L11.5 9 L8 7 L4.5 9 Z" fill="currentColor" /></svg>
                <span class="wind-value"></span>
              </span>
              <span class="precip" hidden>
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2C8 2 3.5 8 3.5 11a4.5 4.5 0 0 0 9 0C12.5 8 8 2 8 2Z" fill="currentColor" /></svg>
                <span class="precip-value"></span>
              </span>
            </button>
          </li>
          <li>
            <button type="button" class="city-button" data-name="Bangkok" data-lat="13.7563" data-lon="100.5018" aria-pressed="false">
              <span class="weather-icon" aria-hidden="true"></span>
              <span class="city">Bangkok</span><span class="temp">--</span><span class="weather">Loading…</span>
              <span class="wind">
                <svg class="wind-arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2 L11.5 9 L8 7 L4.5 9 Z" fill="currentColor" /></svg>
                <span class="wind-value"></span>
              </span>
              <span class="precip" hidden>
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2C8 2 3.5 8 3.5 11a4.5 4.5 0 0 0 9 0C12.5 8 8 2 8 2Z" fill="currentColor" /></svg>
                <span class="precip-value"></span>
              </span>
            </button>
          </li>
          <li>
            <button type="button" class="city-button" data-name="Vancouver" data-lat="49.2827" data-lon="-123.1207" aria-pressed="false">
              <span class="weather-icon" aria-hidden="true"></span>
              <span class="city">Vancouver</span><span class="temp">--</span><span class="weather">Loading…</span>
              <span class="wind">
                <svg class="wind-arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2 L11.5 9 L8 7 L4.5 9 Z" fill="currentColor" /></svg>
                <span class="wind-value"></span>
              </span>
              <span class="precip" hidden>
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2C8 2 3.5 8 3.5 11a4.5 4.5 0 0 0 9 0C12.5 8 8 2 8 2Z" fill="currentColor" /></svg>
                <span class="precip-value"></span>
              </span>
            </button>
          </li>
        </ul>
        <p id="lastUpdated" class="last-updated"></p>
      </section>

      <section class="about fade-up">
        <h2>About</h2>
        <p>
          weather_glass는 특정 시각의 공기 흐름을 flow-field 파티클로 시각화하는 실험적 프로젝트입니다.<br />
          시간 슬라이더를 움직이면 하루 동안의 빛과 색의 변화를 캔버스 위에서 즉시 확인할 수 있습니다.
        </p>
        <p>
          시간 슬라이더는 낮과 밤의 밝기를 조절하고<br />
          흐름의 속도, 방향, 흐트러짐은 선택한 도시의 실시간 바람과 강수, 구름량 데이터로 결정됩니다.
        </p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
