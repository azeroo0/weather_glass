<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>weather_glass</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="flowCanvas"></canvas>
    <nav>
      <span class="logo">weather_glass</span>
    </nav>
    <main>
      <section class="hero">
        <h1>오늘의 공기를 흐름으로 그리다</h1>
        <p>시간에 따라 달라지는 공기의 흐름을 파티클로 그려냅니다.</p>
        <input id="timeSlider" type="range" min="0" max="24" step="0.1" value="12" />
        <div class="time-info">
          <span id="currentTime">12:00</span>
          <span id="weatherLabel">정오</span>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
